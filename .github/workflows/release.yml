name: Build and Release

on:
  schedule:
    # 每周日 UTC 02:00 (北京时间 10:00) 定时编译 pre 版本并推送 tag (不发布 Release)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本标签 (如 v1.0.1 或 pre-v1.0.1，留空则自动按日期生成)'
        required: false
        default: ''
      publish_release:
        description: '是否发布到 GitHub Release (默认发布；若取消勾选则仅打 tag 不建 Release)'
        type: boolean
        default: true
      prerelease:
        description: '是否标记为预发布 (Pre-release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package TaskCleaner.app
    runs-on: macos-14

    steps:
      - name: Checkout GUI Repository
        uses: actions/checkout@v4
        with:
          path: macos-task-cleaner-gui

      - name: Checkout Core Repository
        uses: actions/checkout@v4
        with:
          repository: macos-task-cleaner/macos-task-cleaner-core
          path: macos-task-cleaner-core

      - name: Checkout CLI Repository
        uses: actions/checkout@v4
        with:
          repository: macos-task-cleaner/macos-task-cleaner-cli
          path: macos-task-cleaner-cli

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Compile Multi-Architecture mtc Engine
        working-directory: macos-task-cleaner-cli
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist/arm64 dist/x86_64 dist/universal target/release
          cp target/aarch64-apple-darwin/release/mtc dist/arm64/mtc
          cp target/x86_64-apple-darwin/release/mtc dist/x86_64/mtc
          lipo -create \
            target/aarch64-apple-darwin/release/mtc \
            target/x86_64-apple-darwin/release/mtc \
            -output dist/universal/mtc
          cp dist/universal/mtc target/release/mtc
          chmod +x dist/arm64/mtc dist/x86_64/mtc dist/universal/mtc target/release/mtc
          echo "[CLI 架构检验]"
          file dist/arm64/mtc dist/x86_64/mtc dist/universal/mtc

      - name: Install create-dmg Packaging Utility
        run: |
          brew install create-dmg || true

      - name: Build and Package All Architectures
        working-directory: macos-task-cleaner-gui
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh all

      - name: Compute Release Metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TAG_NAME="pre-$(date +'%Y.%m.%d')"
            RELEASE_TITLE="Task Cleaner Pre-release ${TAG_NAME}"
            PUBLISH_RELEASE="false"
            IS_PRE="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.tag }}" ]; then
              TAG_NAME="${{ github.event.inputs.tag }}"
            else
              TAG_NAME="v$(date +'%Y.%m.%d')"
            fi
            RELEASE_TITLE="Task Cleaner Release ${TAG_NAME}"
            PUBLISH_RELEASE="${{ github.event.inputs.publish_release }}"
            IS_PRE="${{ github.event.inputs.prerelease }}"
          else
            TAG_NAME="build-$(date +'%Y.%m.%d')"
            RELEASE_TITLE="Task Cleaner ${TAG_NAME}"
            PUBLISH_RELEASE="false"
            IS_PRE="false"
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          echo "publish_release=${PUBLISH_RELEASE}" >> $GITHUB_OUTPUT
          echo "prerelease=${IS_PRE}" >> $GITHUB_OUTPUT

      - name: Create and Push Git Tag
        working-directory: macos-task-cleaner-gui
        run: |
          TAG_NAME="${{ steps.meta.outputs.tag }}"
          echo "[INFO] Configuring git user for tag push..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a "${TAG_NAME}" -m "Auto tag: ${TAG_NAME}"
          echo "[INFO] Pushing tag ${TAG_NAME} to remote..."
          git push origin "${TAG_NAME}" --force || echo "[WARN] Git push tag returned non-zero status."

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taskcleaner-${{ steps.meta.outputs.tag }}
          path: |
            macos-task-cleaner-gui/build/*.dmg
            macos-task-cleaner-gui/build/*.dmg.sha256
            macos-task-cleaner-gui/build/*.zip
            macos-task-cleaner-gui/build/*.zip.sha256
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.meta.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ### 架构与下载说明 / Architecture & Downloads

            双击打开 DMG 安装盘后，直接拖拽应用图标至 Applications 目录即可完成安装。

            | 架构 / Architecture | 适用设备 / Applicable Devices | 安装包直链下载 / Download DMG |
            | :--- | :--- | :--- |
            | **Apple Silicon** (`arm64`) | Apple M1 / M2 / M3 / M4 系列芯片 Mac | [TaskCleaner-macOS-arm64.dmg](https://github.com/macos-task-cleaner/macos-task-cleaner-gui/releases/download/${{ steps.meta.outputs.tag }}/TaskCleaner-macOS-arm64.dmg) |
            | **AMD64 / Intel** (`x86_64`) | Intel 处理器 / AMD64 架构 Mac | [TaskCleaner-macOS-x86_64.dmg](https://github.com/macos-task-cleaner/macos-task-cleaner-gui/releases/download/${{ steps.meta.outputs.tag }}/TaskCleaner-macOS-x86_64.dmg) |
            | **Universal** (通用架构) | 兼容所有 Apple Silicon 及 Intel Mac | [TaskCleaner-macOS-universal.dmg](https://github.com/macos-task-cleaner/macos-task-cleaner-gui/releases/download/${{ steps.meta.outputs.tag }}/TaskCleaner-macOS-universal.dmg) |
          files: |
            macos-task-cleaner-gui/build/TaskCleaner-macOS-arm64.dmg
            macos-task-cleaner-gui/build/TaskCleaner-macOS-arm64.dmg.sha256
            macos-task-cleaner-gui/build/TaskCleaner-macOS-x86_64.dmg
            macos-task-cleaner-gui/build/TaskCleaner-macOS-x86_64.dmg.sha256
            macos-task-cleaner-gui/build/TaskCleaner-macOS-universal.dmg
            macos-task-cleaner-gui/build/TaskCleaner-macOS-universal.dmg.sha256
            macos-task-cleaner-gui/build/TaskCleaner-macOS.dmg
            macos-task-cleaner-gui/build/TaskCleaner-macOS.dmg.sha256
            macos-task-cleaner-gui/build/TaskCleaner-macOS-arm64.zip
            macos-task-cleaner-gui/build/TaskCleaner-macOS-arm64.zip.sha256
            macos-task-cleaner-gui/build/TaskCleaner-macOS-x86_64.zip
            macos-task-cleaner-gui/build/TaskCleaner-macOS-x86_64.zip.sha256
            macos-task-cleaner-gui/build/TaskCleaner-macOS-universal.zip
            macos-task-cleaner-gui/build/TaskCleaner-macOS-universal.zip.sha256
            macos-task-cleaner-gui/build/TaskCleaner-macOS.zip
            macos-task-cleaner-gui/build/TaskCleaner-macOS.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
